name: dosimetros

services:
  # Base de datos MySQL 8
  db:
    image: mysql:8
    restart: unless-stopped
    # Nombres de tabla sin distinción de mayúsculas/minúsculas (igual que en
    # desarrollo). Evita el error "missing table [asignacion]" en Linux, donde
    # MySQL sí distingue mayúsculas por defecto. Debe fijarse en la primera
    # inicialización de la base de datos.
    command: ["--lower-case-table-names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: dosimetros_db
      MYSQL_USER: dosimetros
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # API REST (Spring Boot)
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      # Activa el perfil 'prod': StartupSecurityCheck aborta el arranque si
      # JWT_SECRET o DB_PASSWORD siguen en su valor de desarrollo por defecto.
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://db:3306/dosimetros_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: dosimetros
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: "86400000"
      # Mismo origen detrás de Caddy: no se necesita CORS.
      CORS_ALLOWED_ORIGINS: ""
    depends_on:
      db:
        condition: service_healthy

  # Servidor web: sirve el frontend y gestiona HTTPS (Caddy)
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
